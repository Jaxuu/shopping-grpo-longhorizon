# Shopping Agent GRPO configuration.
hydra:
  searchpath:
    - pkg://verl/trainer/config

defaults:
  - ppo_trainer
  - _self_

data:
  train_files: ${oc.env:GRPO_TRAIN_FILE}
  val_files: ${oc.env:GRPO_VAL_FILE}
  train_batch_size: 2
  val_batch_size: 2
  max_prompt_length: 4096
  max_response_length: 20480
  return_raw_chat: true
  filter_overlong_prompts: true
  truncation: error

actor_rollout_ref:
  model:
    path: ${oc.env:GRPO_MODEL_PATH}
    trust_remote_code: true
    enable_gradient_checkpointing: true
    use_remove_padding: false
    lora_rank: 16
    lora_alpha: 32
    target_modules: all-linear
    lora:
      merge: true
    override_config:
      attn_implementation: sdpa
  actor:
    ppo_mini_batch_size: 2
    ppo_micro_batch_size_per_gpu: 1
    ppo_max_token_len_per_gpu: 24576
    use_dynamic_bsz: false
    freeze_vision_tower: true
    loss_agg_mode: token-mean
    clip_ratio_low: 0.20
    clip_ratio_high: 0.20
    entropy_coeff: 0.0
    calculate_entropy: true
    use_kl_loss: false
    kl_loss_coef: 0.0
    kl_loss_type: low_var_kl
    optim:
      lr: 5.0e-6
      lr_warmup_steps_ratio: 0.03
    fsdp_config:
      optimizer_offload: true
      param_offload: true
      # 不要加 entropy_from_logits_with_chunking 来救 calculate_entropy：分块只切前向
      # softmax，而 OOM 在反向（calculate_entropy 强制 inplace_backward=False，多留一份
      # [tokens, vocab]）。实测见 plans/m6-grpo-runbook.md §8.13，preflight 会拒绝开熵。
  rollout:
    name: vllm
    mode: async
    n: 4
    temperature: 0.7
    top_p: 0.9
    tensor_model_parallel_size: 1
    gpu_memory_utilization: 0.45
    max_num_seqs: 8
    max_model_len: 24576
    max_num_batched_tokens: 24576
    free_cache_engine: true
    calculate_log_probs: true
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 24576
    log_prob_use_dynamic_bsz: false
    agent:
      num_workers: 8
      default_agent_loop: shopping_tool_agent
      agent_loop_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/agent_loop.yaml
    multi_turn:
      enable: true
      format: qwen3_coder
      max_user_turns: 40
      max_assistant_turns: 40
      max_parallel_calls: 1
      max_tool_response_length: 16384
      tool_response_truncate_side: middle
      tool_config_path: ${oc.env:SHOPPING_GRPO_ROOT}/configs/tools.json
      tokenization_sanity_check_mode: ignore_strippable
    val_kwargs:
      n: 1
      temperature: 0.0
      top_p: 1.0
      do_sample: false
  ref:
    log_prob_micro_batch_size_per_gpu: 1
    log_prob_max_token_len_per_gpu: 24576
    log_prob_use_dynamic_bsz: false
    fsdp_config:
      param_offload: true

algorithm:
  adv_estimator: grpo
  use_kl_in_reward: false
  norm_adv_by_std_in_grpo: false
  rollout_correction:
    bypass_mode: true
    rollout_is: null
    rollout_rs: null
    loss_type: ppo_clip

shopping_dynamic_sampling:
  enable: true
  metric: seq_reward
  max_num_gen_batches: 3
  max_consecutive_skipped_updates: 10
  reward_tolerance: 1.0e-8

shopping_trace:
  enable: false
  epsilon: 0.1
  horizon: 3
  discount: 0.8
  terminal_weight: 2.0
  outcome_weight: 1.0
  turn_weight: 0.2
  max_sequence_length: 24576

reward_model:
  enable: false

ray_kwargs:
  ray_init:
    runtime_env:
      worker_process_setup_hook: shopping_grpo.training.grpo.compat.install_torch_padding_fallback

trainer:
  total_epochs: 50
  # 2026-10-15 定稿：50 步（估算 ~7 h，用户接受），跑完自然停止，不需要人工 Ctrl-C。
  # veRL 的保存/验证条件是 `is_last_step or step % freq == 0`
  # （patches/verl-0.8.0-shopping-dynamic-sampling.patch）⇒ step 50 必定保存 + 必定验证。
  total_training_steps: 50
  # save_freq 必须 ≤ 且整除 test_freq（docs/grpo.md）。25/25 合规：25 ≤ 25 且 25 % 25 == 0。
  # 2026-10-15 定稿 25/25，依据是实测磁盘占用：
  # 每个 global_step_* 存的是**完整模型 state dict**（FSDPCheckpointManager 直接
  # torch.save(model.state_dict())，无 LoRA 过滤；model_merger 靠其中的基座权重剥离
  # `.base_layer.` 才能合并），2B bf16 ⇒ 约 4.2 GB/个（model 4.0 + Adam 0.15 + 杂项）。
  # 所以 save_freq 直接决定磁盘：5/25 会留 10 个 ≈ 42 GB，而验证点同样只有 step 25/50
  # ⇒ 多花的 34 GB 只买到"崩溃时少丢 20 步"的恢复粒度，对选点结果零影响。
  # 25/25 只留 2 个 ≈ 8.4 GB，选点候选完全一样。max_actor_ckpt_to_keep 不能替代大
  # save_freq：它保留的是"最近 N 个"，会把 step 25 在 step 50 之前删掉。
  save_freq: 25
  test_freq: 25
  val_before_train: true
  logger: [console]
  project_name: shopping-grpo
  experiment_name: shopping-agent-grpo
  default_local_dir: ${oc.env:GRPO_OUTPUT_DIR}
  n_gpus_per_node: 1
  nnodes: 1
